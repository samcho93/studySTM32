<text x="360" y="206" font-size="11" fill="var(--text-dim)" text-anchor="middle" font-family="var(--mono)">1비트 = 1 / 115200 s ≈ 8.68 µs  ·  프레임 10비트 ≈ 86.8 µs  ·  최대 11 520 바이트/s</text>
<text x="360" y="226" font-size="10.5" fill="var(--text-faint)" text-anchor="middle">패리티(8E1·8O1)는 D7 뒤에 1비트 추가, STOP 은 1·1.5·2 비트 선택 가능  ·  0x41 = 0b0100_0001</text>
