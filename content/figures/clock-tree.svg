<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-label="STM32F411 클럭 트리 (HSI 16 MHz → PLL → 84 MHz)" font-family="var(--sans)" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text-dim)"/></marker></defs>
<rect x="20" y="40" width="96" height="40" rx="6" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="68.0" y="56.0" font-size="12" fill="var(--text)" text-anchor="middle" font-weight="700">HSI 16 MHz</text>
<text x="68.0" y="72.0" font-size="12" fill="var(--text)" text-anchor="middle">내부 RC ±1 %</text>
<rect x="20" y="96" width="96" height="40" rx="6" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="68.0" y="112.0" font-size="12" fill="var(--text)" text-anchor="middle" font-weight="700">HSE 8 MHz</text>
<text x="68.0" y="128.0" font-size="12" fill="var(--text)" text-anchor="middle">Nucleo: ST-Link MCO</text>
<rect x="20" y="250" width="96" height="40" rx="6" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="68.0" y="266.0" font-size="12" fill="var(--text)" text-anchor="middle" font-weight="700">LSI 32 kHz</text>
<text x="68.0" y="282.0" font-size="12" fill="var(--text)" text-anchor="middle">내부 RC (17~47)</text>
<rect x="20" y="306" width="96" height="40" rx="6" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="68.0" y="322.0" font-size="12" fill="var(--text)" text-anchor="middle" font-weight="700">LSE 32.768 kHz</text>
<text x="68.0" y="338.0" font-size="12" fill="var(--text)" text-anchor="middle">외부 크리스털</text>
<rect x="160" y="32" width="176" height="116" rx="6" fill="var(--accent-soft)" stroke="var(--accent-dim, var(--accent))" />
<text x="248" y="52" font-size="13" fill="var(--accent)" text-anchor="middle" font-weight="700">PLL</text>
<text x="168" y="74" font-size="11" fill="var(--text)" font-family="var(--mono)">÷M = 16  → 1 MHz (VCO 입력)</text>
<text x="168" y="92" font-size="11" fill="var(--text)" font-family="var(--mono)">×N = 336 → 336 MHz (VCO 출력)</text>
<text x="168" y="110" font-size="11" fill="var(--text)" font-family="var(--mono)">÷P = 4   → 84 MHz (PLLCLK)</text>
<text x="168" y="128" font-size="11" fill="var(--text)" font-family="var(--mono)">÷Q = 7   → 48 MHz (USB·SDIO)</text>
<line x1="116" y1="60" x2="160" y2="60" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="116" y1="116" x2="140" y2="116" stroke="var(--text-dim)" stroke-width="1.5"/>
<line x1="140" y1="116" x2="140" y2="100" stroke="var(--text-dim)" stroke-width="1.5"/>
<line x1="140" y1="100" x2="160" y2="100" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="160" y="180" font-size="10.5" fill="var(--text-faint)">PLL 소스 = HSI 또는 HSE (선택)</text>
<path d="M372 40 L412 56 L412 134 L372 150 Z" fill="var(--bg-elev-2)" stroke="var(--border)"/>
<text x="392" y="99" font-size="10.5" fill="var(--text-dim)" text-anchor="middle" font-weight="700">MUX</text>
<line x1="336" y1="90" x2="372" y2="90" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="116" y1="60" x2="128" y2="60" stroke="var(--text-dim)" stroke-width="1.5"/>
<line x1="128" y1="60" x2="128" y2="20" stroke="var(--text-dim)" stroke-width="1.5"/>
<line x1="128" y1="20" x2="356" y2="20" stroke="var(--text-dim)" stroke-width="1.5"/>
<line x1="356" y1="20" x2="356" y2="56" stroke="var(--text-dim)" stroke-width="1.5"/>
<line x1="356" y1="56" x2="372" y2="56" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="140" y1="116" x2="140" y2="162" stroke="var(--text-dim)" stroke-width="1.5"/>
<line x1="140" y1="162" x2="356" y2="162" stroke="var(--text-dim)" stroke-width="1.5"/>
<line x1="356" y1="162" x2="356" y2="136" stroke="var(--text-dim)" stroke-width="1.5"/>
<line x1="356" y1="136" x2="372" y2="136" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="200" y="16" font-size="10" fill="var(--text-faint)">HSI 직결 (리셋 직후 기본)</text>
<text x="300" y="158" font-size="10" fill="var(--text-faint)">HSE 직결</text>
<line x1="412" y1="95" x2="448" y2="95" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="430" y="84" font-size="10" fill="var(--text-faint)" text-anchor="middle" font-family="var(--mono)">SYSCLK</text>
<rect x="448" y="72" width="76" height="46" rx="6" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="486.0" y="91.0" font-size="12" fill="var(--text)" text-anchor="middle" font-weight="700">AHB 분주</text>
<text x="486.0" y="107.0" font-size="12" fill="var(--text)" text-anchor="middle">÷1</text>
<line x1="524" y1="95" x2="560" y2="95" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="542" y="84" font-size="10" fill="var(--text-faint)" text-anchor="middle" font-family="var(--mono)">HCLK</text>
<rect x="560" y="40" width="150" height="110" rx="6" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="635" y="60" font-size="12.5" fill="var(--text)" text-anchor="middle" font-family="var(--mono)" font-weight="700">HCLK 84 MHz</text>
<text x="635" y="80" font-size="11" fill="var(--text-dim)" text-anchor="middle">Cortex-M4 코어 · FPU</text>
<text x="635" y="96" font-size="11" fill="var(--text-dim)" text-anchor="middle">AHB1: GPIO · DMA · RCC</text>
<text x="635" y="112" font-size="11" fill="var(--text-dim)" text-anchor="middle">SysTick = HCLK 또는 HCLK/8</text>
<text x="635" y="128" font-size="11" fill="var(--text-dim)" text-anchor="middle">Flash 2 WS @ 3.3 V</text>
<text x="635" y="142" font-size="9.5" fill="var(--text-faint)" text-anchor="middle">(RM0383 표: 84 MHz 는 2 WS)</text>
<line x1="542" y1="95" x2="542" y2="210" stroke="var(--text-dim)" stroke-width="1.5"/>
<line x1="542" y1="210" x2="560" y2="210" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="542" y1="280" x2="560" y2="280" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="542" y1="210" x2="542" y2="280" stroke="var(--text-dim)" stroke-width="1.5"/>
<rect x="560" y="186" width="150" height="48" rx="6" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="635" y="204" font-size="11.5" fill="var(--text)" text-anchor="middle" font-weight="700">APB1 ÷2 → PCLK1 42 MHz</text>
<text x="635" y="222" font-size="10.5" fill="var(--accent)" text-anchor="middle">TIM2~5 클럭 = 42 × 2 = 84 MHz</text>
<rect x="560" y="256" width="150" height="48" rx="6" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="635" y="274" font-size="11.5" fill="var(--text)" text-anchor="middle" font-weight="700">APB2 ÷1 → PCLK2 84 MHz</text>
<text x="635" y="292" font-size="10.5" fill="var(--accent)" text-anchor="middle">TIM1·9~11 클럭 = 84 × 1 MHz</text>
<text x="635" y="328" font-size="10.5" fill="var(--text-dim)" text-anchor="middle">USART2·I2C·SPI2 = PCLK1 42 MHz</text>
<text x="635" y="344" font-size="10.5" fill="var(--text-dim)" text-anchor="middle">USART1·6·SPI1·ADC = PCLK2 84 MHz</text>
<text x="635" y="360" font-size="9.5" fill="var(--text-faint)" text-anchor="middle">PCLK1 ≤ 50 MHz · PCLK2 ≤ 100 MHz</text>
<line x1="116" y1="270" x2="200" y2="270" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="200" y="252" width="100" height="36" rx="6" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="250.0" y="266.0833333333333" font-size="11.5" fill="var(--text)" text-anchor="middle" font-weight="700">IWDG</text>
<text x="250.0" y="281.5833333333333" font-size="11.5" fill="var(--text)" text-anchor="middle">독립 워치독</text>
<line x1="116" y1="326" x2="200" y2="326" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="200" y="308" width="100" height="36" rx="6" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="250.0" y="322.0833333333333" font-size="11.5" fill="var(--text)" text-anchor="middle" font-weight="700">RTC</text>
<text x="250.0" y="337.5833333333333" font-size="11.5" fill="var(--text)" text-anchor="middle">달력 · 알람</text>
<text x="316" y="276" font-size="10.5" fill="var(--text-faint)">LSI 는 부정확 → 시계는 LSE 사용</text>
<text x="316" y="332" font-size="10.5" fill="var(--text-faint)">(RTC 는 LSE · LSI · HSE/32 중 선택)</text>
<text x="316" y="206" font-size="10.5" fill="var(--text-faint)">MCO1 (PA8): 내부 클럭을 핀으로 출력</text>
<text x="316" y="222" font-size="10.5" fill="var(--text-faint)">CSS: HSE 정지 시 HSI 로 자동 전환 + NMI</text>
</svg>
