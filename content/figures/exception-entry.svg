<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-label="벡터 테이블과 예외 진입 과정 (Cortex-M4, STM32F411)" font-family="var(--sans)" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text-dim)"/></marker></defs>
<text x="16" y="30" font-size="10.5" fill="var(--text-faint)">startup_stm32f411xetx.s 의 g_pfnVectors (Flash 0x0800_0000 → 0x0000_0000 별칭)</text>
<rect x="16" y="42" width="300" height="292" rx="6" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="24" y="57" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x0000</text>
<text x="82" y="57" font-size="10.5" fill="var(--text)" font-family="var(--mono)">_estack</text>
<text x="308" y="57" font-size="9.5" fill="var(--text-faint)" text-anchor="end">초기 MSP 값</text>
<text x="24" y="75" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x0004</text>
<text x="82" y="75" font-size="10.5" fill="var(--text)" font-family="var(--mono)">Reset_Handler</text>
<text x="308" y="75" font-size="9.5" fill="var(--text-faint)" text-anchor="end">−3 (고정)</text>
<text x="24" y="93" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x0008</text>
<text x="82" y="93" font-size="10.5" fill="var(--text)" font-family="var(--mono)">NMI_Handler</text>
<text x="308" y="93" font-size="9.5" fill="var(--text-faint)" text-anchor="end">−2 (고정)</text>
<text x="24" y="111" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x000C</text>
<text x="82" y="111" font-size="10.5" fill="var(--text)" font-family="var(--mono)">HardFault_Handler</text>
<text x="308" y="111" font-size="9.5" fill="var(--text-faint)" text-anchor="end">−1 (고정)</text>
<text x="24" y="129" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x0010</text>
<text x="82" y="129" font-size="10.5" fill="var(--text)" font-family="var(--mono)">MemManage_Handler</text>
<text x="308" y="129" font-size="9.5" fill="var(--text-faint)" text-anchor="end">설정 가능</text>
<text x="24" y="147" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x0014</text>
<text x="82" y="147" font-size="10.5" fill="var(--text)" font-family="var(--mono)">BusFault_Handler</text>
<text x="308" y="147" font-size="9.5" fill="var(--text-faint)" text-anchor="end">설정 가능</text>
<text x="24" y="165" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x0018</text>
<text x="82" y="165" font-size="10.5" fill="var(--text)" font-family="var(--mono)">UsageFault_Handler</text>
<text x="308" y="165" font-size="9.5" fill="var(--text-faint)" text-anchor="end">설정 가능</text>
<text x="24" y="183" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x002C</text>
<text x="82" y="183" font-size="10.5" fill="var(--text)" font-family="var(--mono)">SVC_Handler</text>
<text x="308" y="183" font-size="9.5" fill="var(--text-faint)" text-anchor="end">설정 가능</text>
<text x="24" y="201" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x0038</text>
<text x="82" y="201" font-size="10.5" fill="var(--text)" font-family="var(--mono)">PendSV_Handler</text>
<text x="308" y="201" font-size="9.5" fill="var(--text-faint)" text-anchor="end">설정 가능</text>
<text x="24" y="219" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x003C</text>
<text x="82" y="219" font-size="10.5" fill="var(--text)" font-family="var(--mono)">SysTick_Handler</text>
<text x="308" y="219" font-size="9.5" fill="var(--text-faint)" text-anchor="end">HAL: 15</text>
<text x="24" y="237" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x0040</text>
<text x="82" y="237" font-size="10.5" fill="var(--text)" font-family="var(--mono)">WWDG_IRQHandler</text>
<text x="308" y="237" font-size="9.5" fill="var(--text-faint)" text-anchor="end">IRQ 0</text>
<rect x="18" y="242" width="296" height="18" rx="3" fill="var(--accent-soft)" stroke="none" />
<text x="24" y="255" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x0058</text>
<text x="82" y="255" font-size="10.5" fill="var(--accent)" font-family="var(--mono)" font-weight="700">EXTI0_IRQHandler</text>
<text x="308" y="255" font-size="9.5" fill="var(--text-faint)" text-anchor="end">IRQ 6</text>
<rect x="18" y="260" width="296" height="18" rx="3" fill="var(--accent-soft)" stroke="none" />
<text x="24" y="273" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x00B4</text>
<text x="82" y="273" font-size="10.5" fill="var(--accent)" font-family="var(--mono)" font-weight="700">TIM3_IRQHandler</text>
<text x="308" y="273" font-size="9.5" fill="var(--text-faint)" text-anchor="end">IRQ 29</text>
<text x="24" y="291" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x00D8</text>
<text x="82" y="291" font-size="10.5" fill="var(--text)" font-family="var(--mono)">USART2_IRQHandler</text>
<text x="308" y="291" font-size="9.5" fill="var(--text-faint)" text-anchor="end">IRQ 38</text>
<text x="24" y="309" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">0x00E0</text>
<text x="82" y="309" font-size="10.5" fill="var(--text)" font-family="var(--mono)">EXTI15_10_IRQHandler</text>
<text x="308" y="309" font-size="9.5" fill="var(--text-faint)" text-anchor="end">IRQ 40</text>
<text x="24" y="327" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">…</text>
<text x="82" y="327" font-size="10.5" fill="var(--text)" font-family="var(--mono)">0x40 + 4 × IRQ 번호</text>
<text x="308" y="327" font-size="9.5" fill="var(--text-faint)" text-anchor="end">총 86개 (F411)</text>
<text x="16" y="354" font-size="10" fill="var(--text-faint)">우선순위: 음수 = 고정, 나머지는 NVIC/SCB 로 설정</text>
<text x="430.0" y="46" font-size="11.5" fill="var(--text)" text-anchor="middle" font-weight="700">자동 스태킹 8워드 (32 B)</text>
<rect x="378" y="60" width="104" height="24" rx="0" fill="var(--accent-soft)" stroke="var(--border)" />
<text x="430.0" y="76" font-size="11" fill="var(--text)" text-anchor="middle" font-family="var(--mono)">R0</text>
<rect x="378" y="84" width="104" height="24" rx="0" fill="var(--accent-soft)" stroke="var(--border)" />
<text x="430.0" y="100" font-size="11" fill="var(--text)" text-anchor="middle" font-family="var(--mono)">R1</text>
<rect x="378" y="108" width="104" height="24" rx="0" fill="var(--accent-soft)" stroke="var(--border)" />
<text x="430.0" y="124" font-size="11" fill="var(--text)" text-anchor="middle" font-family="var(--mono)">R2</text>
<rect x="378" y="132" width="104" height="24" rx="0" fill="var(--accent-soft)" stroke="var(--border)" />
<text x="430.0" y="148" font-size="11" fill="var(--text)" text-anchor="middle" font-family="var(--mono)">R3</text>
<rect x="378" y="156" width="104" height="24" rx="0" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="430.0" y="172" font-size="11" fill="var(--text)" text-anchor="middle" font-family="var(--mono)">R12</text>
<rect x="378" y="180" width="104" height="24" rx="0" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="430.0" y="196" font-size="11" fill="var(--text)" text-anchor="middle" font-family="var(--mono)">LR (R14)</text>
<rect x="378" y="204" width="104" height="24" rx="0" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="430.0" y="220" font-size="11" fill="var(--text)" text-anchor="middle" font-family="var(--mono)">PC (복귀 주소)</text>
<rect x="378" y="228" width="104" height="24" rx="0" fill="var(--bg-elev-2)" stroke="var(--border)" />
<text x="430.0" y="244" font-size="11" fill="var(--text)" text-anchor="middle" font-family="var(--mono)">xPSR</text>
<text x="372" y="76" font-size="10" fill="var(--accent)" text-anchor="end" font-family="var(--mono)">SP(새) →</text>
<text x="372" y="256" font-size="10" fill="var(--text-dim)" text-anchor="end" font-family="var(--mono)">SP(이전) →</text>
<text x="430.0" y="272" font-size="10" fill="var(--text-faint)" text-anchor="middle">낮은 주소 ↑  높은 주소 ↓</text>
<text x="430.0" y="288" font-size="10" fill="var(--text-faint)" text-anchor="middle">FPU 사용 시 +S0~S15·FPSCR</text>
<text x="430.0" y="302" font-size="10" fill="var(--text-faint)" text-anchor="middle">= 26워드 (lazy stacking)</text>
<circle cx="509" cy="56" r="9" fill="var(--accent)"/><text x="509" y="60" font-size="10.5" fill="var(--on-accent, #fff)" text-anchor="middle" font-family="var(--mono)" font-weight="700">1</text>
<text x="526" y="60" font-size="12" fill="var(--text)" font-weight="700">인터럽트 요청</text>
<text x="526" y="76" font-size="10.5" fill="var(--text-dim)">주변장치 → NVIC pending.</text>
<text x="526" y="89" font-size="10.5" fill="var(--text-dim)">우선순위가 현재보다 높으면 진입</text>
<circle cx="509" cy="120" r="9" fill="var(--accent)"/><text x="509" y="124" font-size="10.5" fill="var(--on-accent, #fff)" text-anchor="middle" font-family="var(--mono)" font-weight="700">2</text>
<text x="526" y="124" font-size="12" fill="var(--text)" font-weight="700">스태킹</text>
<text x="526" y="140" font-size="10.5" fill="var(--text-dim)">현재 명령 마무리 후 8워드를 SP 에</text>
<text x="526" y="153" font-size="10.5" fill="var(--text-dim)">하드웨어가 push (약 12 사이클)</text>
<circle cx="509" cy="184" r="9" fill="var(--accent)"/><text x="509" y="188" font-size="10.5" fill="var(--on-accent, #fff)" text-anchor="middle" font-family="var(--mono)" font-weight="700">3</text>
<text x="526" y="188" font-size="12" fill="var(--text)" font-weight="700">벡터 읽기</text>
<text x="526" y="204" font-size="10.5" fill="var(--text-dim)">VTOR + 4×번호 에서 핸들러 주소</text>
<text x="526" y="217" font-size="10.5" fill="var(--text-dim)">fetch, LR =</text>
<text x="526" y="230" font-size="10.5" fill="var(--text-dim)">0xFFFF_FFF9</text>
<circle cx="509" cy="248" r="9" fill="var(--accent)"/><text x="509" y="252" font-size="10.5" fill="var(--on-accent, #fff)" text-anchor="middle" font-family="var(--mono)" font-weight="700">4</text>
<text x="526" y="252" font-size="12" fill="var(--text)" font-weight="700">핸들러 실행</text>
<text x="526" y="268" font-size="10.5" fill="var(--text-dim)">핸들러 모드·특권.</text>
<text x="526" y="281" font-size="10.5" fill="var(--text-dim)">xxx_IRQHandler 는 보통의</text>
<text x="526" y="294" font-size="10.5" fill="var(--text-dim)">C 함수</text>
<circle cx="509" cy="312" r="9" fill="var(--accent)"/><text x="509" y="316" font-size="10.5" fill="var(--on-accent, #fff)" text-anchor="middle" font-family="var(--mono)" font-weight="700">5</text>
<text x="526" y="316" font-size="12" fill="var(--text)" font-weight="700">복귀</text>
<text x="526" y="332" font-size="10.5" fill="var(--text-dim)">bx lr → 8워드 pop → 스레드</text>
<text x="526" y="345" font-size="10.5" fill="var(--text-dim)">모드로 (다음 IRQ 가 대기 중이면</text>
<text x="526" y="358" font-size="10.5" fill="var(--text-dim)">테일체이닝)</text>
</svg>
